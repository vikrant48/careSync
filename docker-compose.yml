version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: caresync-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caresync
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-caresync}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-caresync}
    ports:
      - "5433:5432" # Host port 5433 to avoid conflict with local postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caresync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-caresync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: caresync-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Override URL to point to internal postgres service by service name "postgres"
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/caresync
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-caresync}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-caresync}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_EXPIRATION=86400000
      - APP_JWT_REFRESH_EXPIRATION=3600000
      - APP_JWT_PASSWORD_RESET_EXPIRATION=900000
      - APP_FILE_UPLOAD_PATH=/app/uploads/
      - APP_FILE_MAX_SIZE=10485760
      - APP_FILE_ALLOWED_EXTENSIONS=jpg,jpeg,png,pdf,doc,docx
      - APP_SECURITY_MAX_LOGIN_ATTEMPTS=5
      - APP_SECURITY_LOGIN_ATTEMPT_WINDOW=900000
      - APP_SECURITY_IP_BLOCK_DURATION=3600000
      # Supabase S3 Storage
      - SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT}
      - SUPABASE_S3_ACCESS_KEY=${SUPABASE_S3_ACCESS_KEY}
      - SUPABASE_S3_SECRET_KEY=${SUPABASE_S3_SECRET_KEY}
      - SUPABASE_S3_REGION=${SUPABASE_S3_REGION:-ap-south-1}
      - SUPABASE_S3_BUCKET=${SUPABASE_S3_BUCKET}
      - SUPABASE_S3_PUBLIC_URL_PREFIX=${SUPABASE_S3_PUBLIC_URL_PREFIX}
      # Redis Cache
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-13670}
      - REDIS_USERNAME=${REDIS_USERNAME:-default}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SSL=${REDIS_SSL:-false}
      # SMTP Mail
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      - SPRING_MAIL_DEFAULT_ENCODING=${SPRING_MAIL_DEFAULT_ENCODING:-UTF-8}
      - MAIL_API_PROVIDER=${MAIL_API_PROVIDER:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      # Razorpay
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_MERCHANT_UPI_ID=${RAZORPAY_MERCHANT_UPI_ID}
      # AI / Misc
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caresync-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  caresync-network:
    driver: bridge