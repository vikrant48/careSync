spring.datasource.url=jdbc:h2:mem:careSyncTest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Provide dummy values for properties required at context startup
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expiration=3600000

cloudinary.cloud-name=test
cloudinary.api-key=123456
cloudinary.api-secret=abc123

# Razorpay dummy configuration for tests
app.payment.razorpay.key-id=test_key_id
app.payment.razorpay.key-secret=test_key_secret
app.payment.merchant.upi-id=testmerchant@upi

# Disable mail sending in tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Dummy values for placeholders that have no default in application.properties (tests only)
app.security.encryption-key=test-only-encryption-key-not-for-production
app.supabase.s3.endpoint=http://localhost:9000
app.supabase.s3.access-key=test
app.supabase.s3.secret-key=test
app.supabase.s3.bucket=test-bucket
app.supabase.s3.public-url-prefix=http://localhost:9000/test-bucket
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
# The main config forces the PostgreSQL dialect; H2 cannot parse its row-lock syntax (FOR NO KEY UPDATE)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Tests build the schema from the entities (H2); Flyway scripts are PostgreSQL-specific
spring.flyway.enabled=false
