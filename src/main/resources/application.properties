spring.application.name=careSync

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# JPA/Hibernate
# Schema changes come only from Flyway (src/main/resources/db/migration). Hibernate just checks the schema
# matches the entities; it never alters tables at startup.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
# Lazy links (patient, doctor, histories, booked tests...) load for up to 50 rows per query instead of one by one
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# An existing database without Flyway history is recorded at version 1 (the baseline) and continues with V2
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Never let a startup wipe the schema
spring.flyway.clean-disabled=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

app.cors.allowed-origins = ${APP_CORS_ALLOWED_ORIGINS:https://caresync-vikrant.vercel.app,http://localhost:4200}

# JWT Configuration
app.jwt.secret = ${APP_JWT_SECRET}
# Access tokens are short-lived; the refresh token keeps the session going. Every token is checked against
# its server-side session, so logout, password reset and admin actions take effect at once.
app.jwt.expiration = ${APP_JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration = ${APP_JWT_REFRESH_EXPIRATION_MS:86400000}
app.jwt.password-reset-expiration = 900000

# File Upload Configuration
app.file.upload.path=uploads/
app.file.max-size=5242880
app.file.allowed-extensions=jpg,jpeg,png,pdf,doc,docx
# Multipart upload limits (5 MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Security Configuration
app.security.max-login-attempts=5
app.security.login-attempt-window=900000
# Session ends after this much inactivity, and in any case this long after login
app.security.session-timeout=${APP_SESSION_IDLE_TIMEOUT_MS:3600000}
app.security.session-max-lifetime=${APP_SESSION_MAX_LIFETIME_MS:86400000}
app.security.ip-block-duration=3600000
# Number of reverse proxies in front of the app; the client IP is read from X-Forwarded-For that many
# entries from the right (0 = no proxy, use the TCP peer; 1 = one load balancer/platform router)
app.security.trusted-proxy-hops=${APP_SECURITY_TRUSTED_PROXY_HOPS:1}

# Seeding endpoints (/api/seed/**) are disabled unless explicitly enabled; ADMIN-only when on
app.seeding.enabled=${APP_SEEDING_ENABLED:false}

# Swagger Configuration
# API docs list every endpoint and parameter: off unless SWAGGER_ENABLED=true (local development)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging & Console Formatting
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{36}){cyan} : %m%n

# Logging Configuration (Clean & Concise)
logging.level.root=INFO
logging.level.com.vikrant.careSync=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=WARN

# Spring Boot DevTools Configuration for Auto-restart and Hot Reload
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,templates/**
spring.devtools.restart.poll-interval=1000
spring.devtools.restart.quiet-period=400



# Jackson Configuration for LocalDateTime serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

# Supabase Storage Configuration (S3 Compatible)
app.supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT}
app.supabase.s3.access-key=${SUPABASE_S3_ACCESS_KEY}
app.supabase.s3.secret-key=${SUPABASE_S3_SECRET_KEY}
app.supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
app.supabase.s3.bucket=${SUPABASE_S3_BUCKET}
app.supabase.s3.public-url-prefix=${SUPABASE_S3_PUBLIC_URL_PREFIX}
# Bucket with public access OFF for medical and identity files (served through signed links). Empty = not used yet.
app.supabase.s3.private-bucket=${SUPABASE_S3_PRIVATE_BUCKET:}
app.storage.signed-url-ttl-minutes=${STORAGE_SIGNED_URL_TTL_MINUTES:15}

# Payment Gateway Configuration
# Razorpay Configuration
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.payment.razorpay.merchant-upi-id=${RAZORPAY_MERCHANT_UPI_ID}

# Payment Gateway Secret Key (for additional security)
app.payment.gateway.secret-key=${PAYMENT_GATEWAY_SECRET_KEY:your_gateway_secret_here}

# Merchant UPI ID
app.payment.merchant.upi-id=${MERCHANT_UPI_ID:vikrantchauhan9794@okicici}

# Payment Webhook Configuration
app.payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:your_webhook_secret_here}

# Payment Configuration
# Demo mode: no real gateway is connected, so payments are marked paid at once and no money is collected.
# Turning it off refuses all payments until a live gateway integration exists.
app.payment.demo-mode=${PAYMENT_DEMO_MODE:true}
app.payment.currency=INR
app.payment.auto-capture=true
app.payment.retry-attempts=3
app.payment.retry-delay-seconds=5

# Payment Security Configuration
app.payment.signature-validation=true
app.payment.webhook-ip-whitelist=${PAYMENT_WEBHOOK_IPS:127.0.0.1,::1}

# Payment Notification Configuration
app.payment.notification.email.enabled=true
app.payment.notification.sms.enabled=false

# Gmail SMTP Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.default-encoding=${SPRING_MAIL_DEFAULT_ENCODING:UTF-8}

# Mail timeouts and debug
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}
spring.mail.properties.mail.debug=${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:false}

# Resend HTTP Mail API (Primary for Cloud / Render)
mail.api.provider=${MAIL_API_PROVIDER:resend}
resend.api.key=${RESEND_API_KEY:}
mail.from.address=${MAIL_FROM_ADDRESS:}

# AI Configuration
app.ai.groq.api-key=${GROQ_API_KEY:}
# AI uses free models only: Groq gpt-oss (chat, clinical text) and Google Gemini Flash (vision).
# Main chat model and the models tried next (retired, rate limited, overloaded or invalid JSON).
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
app.ai.groq.fallback-models=${GROQ_FALLBACK_MODELS:openai/gpt-oss-120b,openai/gpt-oss-20b}
# Simple tasks (rewriting, extraction) start on the small model; chat and clinical reasoning use GROQ_MODEL
app.ai.groq.fast-model=${GROQ_FAST_MODEL:openai/gpt-oss-20b}
# Per-user AI allowance (model calls). The free provider quotas are shared by everyone.
app.ai.quota.enabled=${AI_QUOTA_ENABLED:true}
app.ai.quota.per-minute=${AI_USER_PER_MINUTE:10}
app.ai.quota.per-day=${AI_USER_PER_DAY:150}
# Longest answer in tokens; gpt-oss reasoning effort (low = faster and uses less of the free quota)
app.ai.groq.max-tokens=${GROQ_MAX_TOKENS:2048}
app.ai.groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
app.ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
# Vision (document scan, certificate check) and text fallback. The key is sent as a header, never in the URL.
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
app.ai.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:4096}
# Every AI call gives up instead of holding a server thread forever
app.ai.http.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
app.ai.http.read-timeout-ms=${AI_READ_TIMEOUT_MS:45000}

# Google OAuth Configuration
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Redis Configuration
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.cache.type=redis

# HIPAA Security
app.security.encryption-key=${ENCRYPTION_KEY}
# true while old AES/ECB or plaintext values may remain; set false after the re-encryption job reports
# nothing left to rewrite, so any value not written by the app is refused
app.security.field-encryption.accept-legacy=${FIELD_ENCRYPTION_ACCEPT_LEGACY:true}

# LiveKit Video Consultation Configuration
livekit.url=${LIVEKIT_URL:wss://your-project.livekit.cloud}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}

# Data retention (nightly purge at 03:30). Clinical records and the access audit trail are never purged.
app.retention.one-time-codes-days=${RETENTION_ONE_TIME_CODES_DAYS:1}
app.retention.login-attempts-days=${RETENTION_LOGIN_ATTEMPTS_DAYS:90}
app.retention.sent-emails-days=${RETENTION_SENT_EMAILS_DAYS:30}
app.retention.ai-text-days=${RETENTION_AI_TEXT_DAYS:30}
